name: Publish tether to PyPI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/publish-pypi.yml]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-tether
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: version
        name: Check whether this version needs publishing
        shell: python
        run: |
          import json, os, tomllib, urllib.request, urllib.error
          from pathlib import Path
          project=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          version=project['version']
          if os.environ.get('GITHUB_REF_TYPE')=='tag' and os.environ['GITHUB_REF_NAME']!='v'+version:
              raise SystemExit('Release tag must match pyproject.toml version')
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/tether/'+version+'/json',timeout=30):
                  publish='false'
                  print('Version',version,'already exists; nothing will be overwritten.')
          except urllib.error.HTTPError as exc:
              if exc.code!=404:raise
              publish='true'
              print('Will validate and publish version',version)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('publish='+publish+'\n')
  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]' build twine uv
      - name: Tests, including package metadata and icon regressions
        run: python -m pytest -q
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Install the wheel and the desktop extra in isolated environments
        run: python scripts/check_distribution.py
  publish:
    needs: [version, test]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]' build twine playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser interaction and calendar regression tests
        run: |
          python scripts/check_ui.py
          python scripts/capture_screenshots.py
      - name: Build the tested release
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: tested-release-and-screenshots
          path: |
            dist/*
            docs/screenshots/*.png
      - name: Publish with the configured PyPI token
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_KEY }}
        run: |
          test -n "$TWINE_PASSWORD" || { echo 'PYPI_API_KEY is not available to this workflow'; exit 1; }
          python -m twine upload --verbose --non-interactive --disable-progress-bar dist/*
      - name: Confirm the version is visible on PyPI
        shell: python
        run: |
          import json, time, tomllib, urllib.request, urllib.error
          from pathlib import Path
          version=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen('https://pypi.org/pypi/tether/'+version+'/json',timeout=15) as response:
                      result=json.load(response)
                  assert result['info']['version']==version and result['urls']
                  print('Confirmed on PyPI: tether',version)
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code!=404:raise
                  time.sleep(5)
          else:raise SystemExit('Upload returned success but the release is not yet visible on PyPI')
