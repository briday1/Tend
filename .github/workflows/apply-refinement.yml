name: Validate tether 2026.1 refinements
on:
  workflow_dispatch:
  push:
    branches: [fix/2026-1-workflow-and-ui]
    paths: ['.github/refinement/**', '.github/workflows/apply-refinement.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2026-1-workflow-and-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply integrity-checked source changes
        shell: python
        run: |
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in sorted(Path('.github/refinement').glob('*.b64')))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='71bca81f374bbfffaabf84402f3191442c78790f377f4003e810caf1a11fea12', 'Payload checksum mismatch'
          records=json.loads(lzma.decompress(packed));staged=[]
          for record in records:
              relative=Path(record['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              assert str(relative) in {'README.md','pyproject.toml'} or relative.parts[0] in {'tend','scripts','tests'}
              path=root/relative
              if record['git_before']:
                  actual=subprocess.check_output(['git','hash-object','--',str(relative)],text=True).strip()
                  assert actual==record['git_before'], f'Base changed: {relative}'
              else:assert not path.exists(), f'Unexpected existing file: {relative}'
              original=path.read_text(encoding='utf-8') if path.exists() else ''
              updated=record.get('content',original)
              for start,end,text in reversed(record.get('edits',[])):
                  updated=updated[:start]+text+updated[end:]
              assert hashlib.sha256(updated.encode()).hexdigest()==record['after'], f'Result mismatch: {relative}'
              staged.append((path,updated))
          for path,text in staged:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text,encoding='utf-8')
          Path('/tmp/tether-refinement-paths.json').write_text(json.dumps([r['path'] for r in records]))
          print('Applied verified source files:',len(records))
      - name: Install application and test dependencies
        run: python -m pip install '.[dev]' build twine uv playwright
      - name: Python regressions and syntax
        run: |
          python -m compileall -q tend scripts tests
          python -m pytest -q
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Test UI, navigation, attention, and action notes
        run: |
          python scripts/check_ui.py
          python scripts/check_session_ui.py
          python scripts/capture_screenshots.py
      - name: Build and clean-install distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tether-2026.1-validation
          retention-days: 5
          path: |
            docs/screenshots/
            dist/
            tests/
            tend/
            scripts/
      - name: Commit only validated source and desktop screenshots
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          run=lambda *args:subprocess.run(args,check=True)
          paths=json.loads(Path('/tmp/tether-refinement-paths.json').read_text())
          run('git','config','user.name','github-actions[bot]')
          run('git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          run('git','add','--',*paths)
          images=[str(p) for p in Path('docs/screenshots').glob('*.png') if 'mobile' not in p.name]
          if images:run('git','add','--',*images)
          run('git','rm','--ignore-unmatch','--','docs/screenshots/conversation-mobile.png','docs/screenshots/snapshot-mobile.png')
          run('git','rm','-r','.github/refinement')
          run('git','commit','-m','Implement tether 2026.1: durable chat, scoped attention and notes, compact themed UI')
          run('git','push','origin','HEAD:fix/2026-1-workflow-and-ui')
