<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tend</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#29402f;font:16px system-ui,sans-serif}.app{max-width:1150px;margin:auto;min-height:100vh;display:grid;grid-template-columns:230px 1fr}aside{border-right:1px solid #dbe3db;padding:28px 18px}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1.4px;margin:0 0 8px}.logo{font-size:34px;font-weight:800;letter-spacing:-2px;margin-bottom:34px}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;color:#47654e;margin:4px 0}nav button:hover,nav button.active{background:#e2ece3}main{padding:48px clamp(20px,5vw,64px)}p{color:#66796a;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer}input,textarea,select{padding:10px;border:1px solid #d7e1d8;border-radius:9px;min-width:0;background:white}.capture{display:flex;gap:8px;margin:27px 0}.capture input{flex:1}.primary{background:#356447;color:#fff;padding:11px 16px;border:0;border-radius:9px}.secondary{border:1px solid #d7e1d8;border-radius:9px;background:white;padding:9px 12px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:36px 0 12px}.bar input{width:230px;max-width:52%}.card,.entry{background:#fff;border:1px solid #e0e7df;border-radius:12px;padding:18px;margin:10px 0}.card{cursor:pointer}.card:hover{border-color:#a4bfaa}.tag{float:right;border-radius:18px;background:#ecf2e9;font-size:12px;padding:5px 9px}.due{background:#f8e6c7}.meta{font-size:12px;color:#7c8b7d}.card p{margin:9px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:18px 0}.controls label{font-size:13px}textarea{width:100%;min-height:90px;resize:vertical}.editor{display:flex;gap:9px;margin:15px 0}.editor textarea{flex:1}.entry{white-space:pre-wrap;overflow-wrap:anywhere}.entry .meta{margin-bottom:7px}.section{margin-top:36px}.related button{margin:4px}.error{color:#a43}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a3c1a8}@media(max-width:650px){.app{display:block}aside{border:0;border-bottom:1px solid #dbe3db;padding:15px 20px}.logo{margin-bottom:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}main{padding:30px 20px}.editor{flex-wrap:wrap}.editor textarea{flex-basis:100%}}
</style><div class="app"><aside><div class="logo">tend<span style="color:#85a98e">.</span></div><nav><button class="active" data-view="attention">✦ Worth revisiting</button><button data-view="all">☰ All threads</button><button data-view="waiting">◷ Waiting</button><button data-view="settled">✓ Settled</button></nav></aside><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let view='attention',current=null,q='';
async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});if(!r.ok)throw Error((await r.json()).detail||r.statusText);return r.json()}
function card(t){return `<article class="card" data-id="${t.id}" role="button" tabindex="0"><span class="tag ${t.due?'due':''}">${t.due?'Revisit now':esc(t.state)}</span><strong>${esc(t.title)}</strong><p>${esc(t.summary||'Something worth keeping in mind.')}</p><span class="meta">${t.entry_count||0} entries · ${new Date(t.updated_at).toLocaleDateString()}</span></article>`}
async function render(){try{if(current)return detail();let threads=await api('/threads?q='+encodeURIComponent(q));let rows=threads.filter(t=>view==='all'||(view==='attention'?t.state==='open'||t.due:t.state===view));let names={attention:"What's on your mind?",all:'Everything you’re tending',waiting:'Waiting on something',settled:'Settled threads'};$('#main').innerHTML=`<h1>${names[view]}</h1><p>Ideas, questions, concerns, plans. You don't have to turn them into tasks.</p><form class="capture" id="capture"><input id="title" maxlength="300" required placeholder="Something I've been thinking about…" aria-label="Capture a thought"><button class="primary">Capture</button></form><div class="bar"><strong>Threads · ${rows.length}</strong><input id="search" value="${esc(q)}" placeholder="Search thoughts…" aria-label="Search"></div><div>${rows.map(card).join('')||'<p>Nothing here yet. Capture a thought to begin.</p>'}</div>`;$('#capture').onsubmit=async e=>{e.preventDefault();let t=await api('/threads','POST',{title:$('#title').value});current=t.id;render()};$('#search').onchange=e=>{q=e.target.value;render()};document.querySelectorAll('[data-id]').forEach(x=>{let open=()=>{current=x.dataset.id;render()};x.onclick=open;x.onkeydown=e=>{if(e.key==='Enter')open()}})}catch(e){$('#main').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
async function detail(){let t=await api('/threads/'+current);$('#main').innerHTML=`<button class="secondary" id="back">← Threads</button><h1 style="margin-top:28px">${esc(t.title)}</h1><div class="controls"><label>State <select id="state">${['open','waiting','paused','settled'].map(s=>`<option ${t.state===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Revisit <input type="datetime-local" id="revisit" value="${t.revisit_at?new Date(t.revisit_at).toISOString().slice(0,16):''}"></label><button class="secondary" id="save">Save</button></div><h3>Where things stand</h3><textarea id="summary" placeholder="What's the current picture?">${esc(t.summary)}</textarea><button class="secondary" id="saveSummary">Save summary</button><section class="section"><h3>What's accumulated</h3>${t.entries.map(e=>`<article class="entry"><div class="meta">${esc(e.kind)} · ${new Date(e.created_at).toLocaleString()} ${e.kind==='action'?`<label style="float:right"><input data-done="${e.id}" type="checkbox" ${e.done?'checked':''}> Done</label>`:''}</div><span style="${e.done?'text-decoration:line-through;opacity:.6':''}">${esc(e.body)}</span></article>`).join('')||'<p>No entries yet.</p>'}<form class="editor" id="addEntry"><select id="kind"><option>thought</option><option>question</option><option>action</option><option>decision</option><option>update</option></select><textarea id="body" required placeholder="Add a thought, question or next step…"></textarea><button class="primary">Add</button></form></section><section class="section related"><h3>Related threads</h3>${t.related.map(r=>`<button class="secondary" data-related="${r.id}">${esc(r.title)}</button>`).join('')||'<p>None yet.</p>'}<div class="controls"><select id="relation"><option value="">Connect a thread…</option></select><button class="secondary" id="link">Connect</button></div></section><div class="section"><button class="secondary" id="delete">Delete thread</button></div>`;
$('#back').onclick=()=>{current=null;render()};$('#save').onclick=async()=>{let v=$('#revisit').value;await api('/threads/'+current,'PATCH',{state:$('#state').value,revisit_at:v?new Date(v).toISOString():null});render()};$('#saveSummary').onclick=async()=>{await api('/threads/'+current,'PATCH',{summary:$('#summary').value});render()};$('#addEntry').onsubmit=async e=>{e.preventDefault();await api('/threads/'+current+'/entries','POST',{kind:$('#kind').value,body:$('#body').value});render()};document.querySelectorAll('[data-done]').forEach(x=>x.onchange=async()=>{await api('/entries/'+x.dataset.done,'PATCH',{done:x.checked});render()});document.querySelectorAll('[data-related]').forEach(x=>x.onclick=()=>{current=x.dataset.related;render()});let all=await api('/threads');$('#relation').insertAdjacentHTML('beforeend',all.filter(x=>x.id!==current&&!t.related.some(r=>r.id===x.id)).map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join(''));$('#link').onclick=async()=>{if(!$('#relation').value)return;await api('/threads/'+current+'/links','POST',{other_id:$('#relation').value});render()};$('#delete').onclick=async()=>{if(confirm('Permanently delete this thread and its entries?')){await api('/threads/'+current,'DELETE');current=null;render()}}}
document.querySelector('nav').onclick=e=>{let b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;current=null;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()};render();
</script></html>
