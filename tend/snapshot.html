<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tend · Snapshots</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--page);color:var(--text)}.shell{max-width:1400px;margin:auto;padding:35px 28px}.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:25px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.muted{color:var(--muted)}.grow{flex:1}.control{border:1px solid var(--line);background:var(--paper);color:var(--text);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}input.control{max-width:158px}.sheet{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:36px 42px 40px}.eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:800;color:var(--accent)}h1{font-size:clamp(32px,5vw,54px);line-height:1.1;letter-spacing:-.055em;margin:12px 0 8px}p{margin:0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:34px 0}.stat{background:var(--soft);border-radius:15px;padding:19px 22px}.stat b{display:block;font-size:34px;letter-spacing:-.05em}.stat small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}.day{min-height:195px;border-right:1px solid var(--line);padding:13px 10px}.day:last-child{border-right:0}.day h3{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 0 16px}.day h3 strong{display:block;color:var(--text);font-size:24px;margin-top:4px}.task{display:block;width:100%;text-align:left;border:0;cursor:pointer;border-radius:8px;padding:9px;margin-bottom:8px;color:#18302c;font:600 12px/1.3 system-ui;overflow-wrap:anywhere}.task:focus-visible{outline:3px solid var(--accent)}.task small{display:block;font-weight:400;opacity:.73;margin-top:5px}.sectionline{margin:29px 0 11px;display:flex;gap:12px;align-items:center}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:23px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.footer{display:flex;justify-content:space-between;gap:15px;margin-top:29px;font-size:12px;color:var(--muted)}.drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 100px #0003;padding:30px;overflow:auto;z-index:4}.drawer[hidden]{display:none}.drawer h2{font-size:30px}.drawer button{float:right}.drawer article{background:var(--soft);border-radius:12px;padding:15px;margin:12px 0}.empty{color:var(--muted);font-size:12px}.err{margin:20px 0;color:#bb4d43} @media(max-width:800px){.sheet{padding:22px}.day{min-height:140px;padding:7px}.summary{gap:6px}.stat{padding:10px}.stat b{font-size:24px}.task{font-size:10px;padding:6px}.shell{padding:16px}.grid{overflow:auto}.day{min-width:85px}}
</style>
<div class="shell"><div class="top"><span class="brand">tend<span style="color:var(--accent)">.</span></span><span class="muted">/ snapshots</span><div class="grow"></div><label>Start <input class="control" id="start" type="date"></label><label>End <input class="control" id="end" type="date"></label><button class="control" id="load">Update</button><button class="control" id="svg">SVG ↓</button><button class="control" id="png">PNG ↓</button><select class="control" id="scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select><select class="control" data-theme-picker></select></div><div class="sheet" id="sheet"><div class="eyebrow">Tend / Activity atlas</div><h1 id="heading">Your week, in focus.</h1><p class="muted" id="range"></p><div class="summary" id="summary"></div><div class="sectionline"><b>The calendar</b><span class="muted">· actual due dates and logged activity</span></div><div class="grid" id="grid"></div><div class="legend" id="legend"></div><div class="footer"><span id="disclaimer"></span><span>TEND / PERSONAL ACTIVITY</span></div></div><div id="error" class="err"></div></div><aside id="drawer" class="drawer" hidden><button class="control" id="close">Close ✕</button><h2 id="dt"></h2><div id="dd"></div></aside>
<script>
const $=s=>document.querySelector(s), palette=['#afd4c0','#f3c5aa','#c6c2ed','#e7d89b','#a9cadf','#edbfcb','#b8d5a1','#d4c3a5'];
let last=null;const dateOnly=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
let today=new Date(),monday=new Date(today);monday.setDate(today.getDate()-(today.getDay()+6)%7);$('#start').value=dateOnly(monday);let sunday=new Date(monday);sunday.setDate(monday.getDate()+6);$('#end').value=dateOnly(sunday);
function color(cat,cats){return palette[cats.indexOf(cat)%palette.length]}
async function showTask(id){const res=await fetch('/api/threads/'+encodeURIComponent(id));if(!res.ok)return;const t=await res.json();$('#dt').textContent=t.title;const dd=$('#dd');dd.replaceChildren();const p=document.createElement('p');p.textContent=[t.category,t.state,t.due_at?'Due '+t.due_at.slice(0,10):''].filter(Boolean).join(' · ');dd.append(p);if(t.summary){const a=document.createElement('article');a.textContent=t.summary;dd.append(a)}for(const e of t.entries||[]){const a=document.createElement('article');a.textContent=e.kind.toUpperCase()+' · '+e.body;dd.append(a)}for(const e of t.activity||[]){const a=document.createElement('article');a.textContent=e.occurred_at.slice(0,10)+' · '+e.body;dd.append(a)}$('#drawer').hidden=false;history.replaceState(null,'','#task/'+encodeURIComponent(id))}
$('#close').onclick=()=>{$('#drawer').hidden=true;history.replaceState(null,'',location.pathname)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#close').click()});
function render(data){last=data;const days=data.days, cats=Object.keys(data.insights.categories);$('#heading').textContent=days.length===1?'A day in focus.':days.length<=7?'Your week, in focus.':'The bigger picture.';$('#range').textContent=data.start+' — '+data.end+' · '+days.length+' days';
$('#summary').replaceChildren();for(const [label,n] of [['Tasks due',data.insights.scheduled_due],['Activity logged',data.insights.activity_events],['Active days',data.insights.active_days]]){const el=document.createElement('div');el.className='stat';el.innerHTML='<b>'+n+'</b><small>'+label+'</small>';$('#summary').append(el)}
const grid=$('#grid');grid.replaceChildren();grid.style.gridTemplateColumns=days.length===1?'1fr':'repeat(7,minmax(0,1fr))';
for(const d of days){const el=document.createElement('div');el.className='day';const date=new Date(d.date+'T12:00:00');const h=document.createElement('h3');h.textContent=date.toLocaleDateString(undefined,{weekday:'short'});const strong=document.createElement('strong');strong.textContent=date.getDate();h.append(strong);el.append(h);for(const t of d.tasks){const b=document.createElement('button');b.className='task';b.style.background=color(t.category,cats);b.textContent=t.title;const sm=document.createElement('small');sm.textContent=t.category+' · '+t.state;b.append(sm);b.onclick=()=>showTask(t.id);el.append(b)}if(d.activity.length){const p=document.createElement('p');p.className='empty';p.textContent=d.activity.length+' logged '+(d.activity.length===1?'event':'events');el.append(p)}grid.append(el)}
const legend=$('#legend');legend.replaceChildren();for(const cat of cats){const x=document.createElement('span'),dot=document.createElement('i');dot.className='dot';dot.style.background=color(cat,cats);x.append(dot,document.createTextNode(cat+' · '+data.insights.categories[cat]));legend.append(x)}$('#disclaimer').textContent='Current due dates + recorded activity; historical task state is not reconstructed.'}
async function load(){try{$('#error').textContent='';const response=await fetch('/api/snapshot?start='+$('#start').value+'&end='+$('#end').value);if(!response.ok)throw Error(await response.text());render(await response.json())}catch(e){$('#error').textContent=e.message}}
$('#load').onclick=load;
function buildSVG(){if(!last)return null;const s=$('#sheet'),w=Math.max(s.scrollWidth,900),h=Math.max(s.scrollHeight,560);const clone=s.cloneNode(true);const css=[...document.styleSheets].flatMap(x=>{try{return [...x.cssRules].map(r=>r.cssText)}catch{return []}}).join('\n');const style=getComputedStyle(document.documentElement);const vars=['page','paper','panel','text','muted','line','soft','accent','accent-text','highlight'].map(k=>'--'+k+':'+style.getPropertyValue('--'+k)+';').join('');const html='<div xmlns="http://www.w3.org/1999/xhtml" style="'+vars+'width:'+w+'px;height:'+h+'px;background:var(--paper);color:var(--text);font-family:system-ui,sans-serif"><style>'+css+'</style>'+clone.outerHTML+'</div>';return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><foreignObject width="100%" height="100%">'+html.replaceAll('&','&amp;').replaceAll('&amp;lt;','&lt;')+'</foreignObject></svg>'}
function save(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#svg').onclick=()=>{const s=buildSVG();if(s)save(new Blob([s],{type:'image/svg+xml'}),'tend-snapshot.svg')};
$('#png').onclick=async()=>{if(!last)return;const theme=document.documentElement.dataset.theme||'sage';const url='/api/snapshot.png?'+new URLSearchParams({start:last.start,end:last.end,theme,scale:$('#scale').value});try{const response=await fetch(url);if(!response.ok)throw Error(await response.text());save(await response.blob(),'tend-'+last.start+'-'+last.end+'.png')}catch(e){$('#error').textContent='PNG export failed: '+e.message}};
load();if(location.hash.startsWith('#task/'))showTask(decodeURIComponent(location.hash.slice(6)));
</script></html>
