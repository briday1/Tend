<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>Tend · Board</title><style>
:root{font:15px system-ui,-apple-system,sans-serif;background:#f5f7f2;color:#263c2f}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#fbfcf9;border-bottom:1px solid #e1e8de;gap:15px}.brand{font-size:26px;font-weight:800;letter-spacing:-1px}nav{display:flex;gap:9px}a{color:#40694d;text-decoration:none}nav a{padding:10px 16px;border-radius:9px}nav a.active{background:#e0ebe0}main{max-width:1500px;padding:38px 30px;margin:auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:start;flex-wrap:wrap}.top h1{font-size:35px;letter-spacing:-1.5px;margin:0}.hint{color:#718476;line-height:1.5}.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start;margin:30px 0}.column{background:#e9eee7;border:1px solid #dce6da;border-radius:16px;padding:15px;min-height:150px}.column h2{font-size:15px;margin:2px 0 17px;display:flex;justify-content:space-between;align-items:center}.count{font-size:12px;color:#758878}.card{background:white;border:1px solid #e0e6df;box-shadow:0 3px 8px #24492b07;border-radius:12px;padding:16px;margin:10px 0;cursor:pointer}.card:hover{border-color:#9fbea5}.card strong{font-size:15px}.card p{color:#7d887e;font-size:13px;margin:9px 0}.chip{display:inline-block;font-size:11px;background:#eef3ed;color:#53705c;padding:4px 7px;border-radius:7px}.due{background:#faeacb}.panel{position:fixed;inset:0 0 0 auto;width:min(520px,100%);background:#fff;z-index:4;box-shadow:none;padding:32px;overflow-y:auto}.panel h2{font-size:24px;margin:20px 0}.panel label{display:block;color:#536e58;font-size:13px;font-weight:700;margin-top:19px;margin-bottom:7px}.panel input,.panel select,.panel textarea{display:block;width:100%;border:1px solid #d4e0d6;border-radius:9px;padding:11px;background:white;color:#263c2f}.panel textarea{min-height:125px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primary{border:0;background:#336347;color:white;padding:12px 18px;border-radius:9px}.secondary{background:#fff;border:1px solid #d6e2d7;border-radius:9px;padding:10px 14px}.entry{padding:12px;background:#f5f7f2;border-radius:9px;margin:7px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted{font-size:12px;color:#7b8b7d}.hidden{display:none!important}#error{color:#a23}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #a8c6aa}@media(max-width:650px){main{padding:26px 14px}header{padding:0 15px}.top h1{font-size:28px}.panel{padding:20px}}
</style><link rel="stylesheet" href="/theme.css"><script src="/theme.js" defer></script><style>html{min-height:100%;background:var(--page)}body{min-height:100vh;background:var(--page)!important}main{min-height:calc(100vh - 66px);max-width:none;width:100%;background:var(--page);padding-left:max(30px,calc((100% - 1500px)/2));padding-right:max(30px,calc((100% - 1500px)/2))}header{height:66px}.brand{color:var(--text)}.board{grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}.column{border-radius:18px;padding:18px;box-shadow:none}.column h2{font-size:17px;margin-bottom:18px}.card{padding:18px;border-radius:13px;box-shadow:none;border-left:4px solid var(--accent);transition:transform .15s,box-shadow .15s}.card:hover{transform:none;box-shadow:none}.card strong{font-size:16px;line-height:1.35;display:block}.card p{line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.top{padding:6px 0 15px}.column{background:var(--soft)!important;border:2px solid var(--category-color)!important}.column h2:before{content:none!important}.column .card{background:var(--task-card-bg,#ffffff)!important;color:var(--task-card-text,#263238)!important;border:1px solid var(--task-card-border,#d9dedb)!important;box-shadow:none!important;transform:none!important}.column .card:hover{box-shadow:none!important;transform:none!important;background:var(--task-card-bg,#ffffff)!important;border-color:var(--task-card-border,#d9dedb)!important}.column .card p{color:var(--task-card-muted,#66747a)!important}.column .card .chip{background:#edf0f0!important;color:#42525a!important}.board .column h2 .count{background:var(--panel);border-radius:99px;padding:5px 9px}.panel{border-left:1px solid var(--line)}.theme-picker{min-width:110px}#board-search{padding:11px 14px;border:1px solid var(--line);border-radius:9px;max-width:210px}@media(max-width:650px){header{gap:5px}nav a{padding:9px}}</style></head><body><header class="topnav"><div class="brand">tend<span>.</span></div><a href="/">Conversation</a><a href="/board" class="active">Board</a><div class="grow"></div><select class="theme-picker" data-theme-picker aria-label="Color theme"></select></header><main><div class="top"><div><h1>Everything you're tending</h1><p class="hint">Organized into areas. Ask Tend to organize things in Conversation, or edit any card yourself.</p></div><div class="row"><input id="board-search" placeholder="Find a thought…" aria-label="Find a thought"><button class="secondary" id="organize">Organize with AI</button><button class="primary" id="new">Add a thought</button></div></div><div id="error" role="alert"></div><div class="board" id="board"></div></main><div class="panel hidden" id="panel" role="dialog" aria-label="Edit thought"><button class="secondary" id="close">← Back to board</button><h2 id="heading">Thought</h2><form id="edit"><label for="title">Title</label><input id="title" maxlength="300" required><label for="category">Category</label><input id="category" list="categories" maxlength="80" required placeholder="Create or choose a category"><datalist id="categories"></datalist><label for="state">Where it stands</label><select id="state"><option value="open">Active</option><option value="waiting">Blocked / waiting</option><option value="paused">Set aside</option><option value="settled">Finished</option></select><label for="summary">Details</label><textarea id="summary" placeholder="Context, questions, links, decisions…"></textarea><label for="revisit">Bring it back (optional)</label><input type="datetime-local" id="revisit"><div class="row" style="margin-top:20px"><button class="primary">Save changes</button><button class="secondary" type="button" id="discuss">Discuss with Tend</button></div></form><h3>Notes & history</h3><div id="entries"></div><form id="note"><label for="body">Add more information</label><textarea id="body" required placeholder="An update, detail, or idea…"></textarea><button class="secondary">Add note</button></form></div><script>
const $=s=>document.querySelector(s);let current=null, searchText="";
const categoryColors=["#3279c7","#bd4a69","#478d57","#b87527","#8058bc","#168d99","#c0523e","#6b7d27","#a33d9d","#5079a4","#aa7746","#318575","#865b49","#98547e","#567bb9","#a65b28","#658742","#8560aa","#b64e52","#3f8ba9","#8c7332","#4e9180","#b06b86","#636bb4"];
function categoryColor(name){let hash=0;for(const char of name.toLowerCase())hash=(Math.imul(hash,31)+char.charCodeAt(0))>>>0;return categoryColors[hash%categoryColors.length]}
function el(tag,className,text){let node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
async function api(path,method='GET',body){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw Error((await r.json()).detail||'Request failed');return r.json()}
function error(e){$('#error').textContent=e.message||String(e)}
async function load(){try{let groups=await api('/board'),board=$('#board');board.replaceChildren();$('#categories').replaceChildren();if(!groups.length){board.append(el('p','hint','Nothing here yet. Tell Tend what you are thinking about.'))}for(let group of groups){const visible=group.threads.filter(t=>(t.title+" "+(t.summary||"")).toLowerCase().includes(searchText));if(!visible.length)continue;let option=el('option');option.value=group.name;$('#categories').append(option);let col=el('section','column'),h=el('h2');col.style.setProperty('--category-color',categoryColor(group.name));h.append(el('span','',group.name),el('span','count',String(visible.length)));col.append(h);for(let t of visible){let card=el('article','card');card.tabIndex=0;card.append(el('strong','',t.title));if(t.summary)card.append(el('p','',t.summary.slice(0,180)));let label=el('span','chip'+(t.due?' due':''),t.due?'Revisit':({open:'Active',waiting:'Waiting',paused:'Set aside',settled:'Finished'}[t.state]||t.state));card.append(label);card.onclick=()=>open(t.id);card.onkeydown=e=>{if(e.key==='Enter')open(t.id)};col.append(card)}board.append(col)}}catch(e){error(e)}}
async function open(id){try{let t=await api('/threads/'+id);current=id;$('#heading').textContent=t.title;$('#title').value=t.title;$('#category').value=t.category||'Unsorted';$('#state').value=t.state;$('#summary').value=t.summary||'';$('#revisit').value=t.revisit_at?new Date(t.revisit_at).toISOString().slice(0,16):'';$('#entries').replaceChildren();for(let e of t.entries){let node=el('div','entry',e.body);node.prepend(el('div','muted',e.kind+' · '+new Date(e.created_at).toLocaleDateString()));$('#entries').append(node)}$('#panel').classList.remove('hidden');$('#title').focus()}catch(e){error(e)}}
$('#close').onclick=()=>{$('#panel').classList.add('hidden');current=null;load()};
$('#edit').onsubmit=async e=>{e.preventDefault();try{let when=$('#revisit').value;await api('/threads/'+current,'PATCH',{title:$('#title').value,category:$('#category').value,summary:$('#summary').value,state:$('#state').value,revisit_at:when?new Date(when).toISOString():null});await load();await open(current)}catch(err){error(err)}};
$('#note').onsubmit=async e=>{e.preventDefault();try{await api('/threads/'+current+'/entries','POST',{kind:'thought',body:$('#body').value});$('#body').value='';await open(current)}catch(err){error(err)}};
$('#board-search').oninput=e=>{searchText=e.target.value.trim().toLowerCase();load()};
$('#new').onclick=async()=>{let title=prompt('What is on your mind?');if(!title?.trim())return;try{let t=await api('/threads','POST',{title:title.trim()});await load();await open(t.id)}catch(e){error(e)}};
$('#discuss').onclick=()=>{location.href='/?discuss='+encodeURIComponent($('#title').value)};
$('#organize').onclick=()=>{location.href='/?discuss='+encodeURIComponent('Please organize my existing threads into meaningful categories on the Board. Look at everything before deciding, use the set_category tool for each appropriate thread, and avoid unnecessary categories. Do not change the original notes.')};
load();
</script></body></html>
