[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tend"
version = "0.2.0"
description = "Local-first home for thoughts and open loops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.2,<2",
  "keyring>=25,<27",
  "markdown-it-py>=3,<5",
  "nh3>=0.2,<1",
]

[project.scripts]
tend = "tend.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tend*"]

[tool.setuptools.package-data]
tend = ["index.html", "board.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
